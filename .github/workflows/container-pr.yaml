name: Container image (PR)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  image:
    name: Build PR image
    uses: vahor-labs/actions/.github/workflows/pr-build.yml@main
    with:
      preview-url: https://vahor-fr-pr-${{ github.event.pull_request.number }}.preview.vahor.fr
      preview-check-url: https://vahor-fr-sha-{sha}.preview.vahor.fr
