name: Clean up untagged images

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      older_than_hours:
        description: "Delete untagged versions older than this many hours"
        required: false
        default: "24"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  untagged:
    name: Delete untagged versions
    uses: vahor-labs/actions/.github/workflows/image-cleanup.yml@main
    with:
      older_than_hours: ${{ github.event.inputs.older_than_hours || '24' }}
