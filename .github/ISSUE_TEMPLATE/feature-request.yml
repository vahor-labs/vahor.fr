name: Feature request
description: Suggest a website improvement.
body:
  - type: markdown
    attributes:
      value: "Reports are public. Do not include credentials, private configurations, private URLs, or unsanitized logs."
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and which page or experience is affected?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Current and desired behavior
      description: What happens today, and what result would solve the problem?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested approach or alternatives (optional)
  - type: textarea
    id: context
    attributes:
      label: Relevant environment or sanitized examples (optional)
      description: Include accessibility or device considerations if relevant. Remove private details.
